name: Verify

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true

      - name: Verify contracts
        run: mise run verify

      - name: Check generated artifacts are committed
        run: |
          test -z "$(git status --porcelain --untracked-files=all)" || {
            git status --porcelain --untracked-files=all
            exit 1
          }

      - name: Fetch main for breaking-change check
        run: git fetch --no-tags origin main:main

      - name: Check breaking changes against main
        run: |
          if buf breaking --against '.git#branch=main'; then
            exit 0
          fi

          breaking_marker_regex='(^[a-z]+(\([^)]+\))?!:)|(^BREAKING CHANGE:)'
          if ! git log --format=%B origin/main..HEAD | grep -Eq "$breaking_marker_regex"; then
            echo "Breaking changes detected without a Conventional Commit breaking marker in the commits that semantic-release will analyze"
            exit 1
          fi

          wire_config="$(printf '%s\n' \
            'version: v2' \
            'modules:' \
            '  - path: proto' \
            'deps:' \
            '  - buf.build/grpc-ecosystem/grpc-gateway' \
            'breaking:' \
            '  use:' \
            '    - WIRE')"
          echo "Breaking changes detected and marked for a major release; checking wire compatibility"
          buf breaking --against '.git#branch=main' --config "$wire_config"
