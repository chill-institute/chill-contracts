name: Verify

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install: true

      - name: Verify contracts
        run: mise run verify

      - name: Check generated artifacts are committed
        run: |
          test -z "$(git status --porcelain --untracked-files=all)" || {
            git status --porcelain --untracked-files=all
            exit 1
          }

      - name: Check compatibility against the pull-request base
        env:
          CONTRACTS_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: mise run compatibility:check

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false

      - name: Install locked semantic-release
        run: npm ci --prefix .github/release --ignore-scripts --no-audit --no-fund

      - name: Smoke-test semantic-release
        run: node .github/release/smoke.mjs
