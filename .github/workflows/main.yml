name: Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    if: "${{ !(contains(github.event.head_commit.message, '[skip ci]') && startsWith(github.event.head_commit.message, 'chore(contracts): release ')) }}"
    runs-on: ubuntu-latest
    concurrency:
      group: verify-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install: true

      - name: Verify contracts
        run: mise run verify

      - name: Check generated artifacts are committed
        run: |
          test -z "$(git status --porcelain --untracked-files=all)" || {
            git status --porcelain --untracked-files=all
            exit 1
          }

  release:
    needs: [verify]
    if: ${{ github.ref == 'refs/heads/main' && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.repository }}-main
      cancel-in-progress: false
    environment: release
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install: true

      - name: Release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          semantic_version: 25.0.3
          extra_plugins: |
            @semantic-release/commit-analyzer@13.0.1
            @semantic-release/release-notes-generator@14.1.1
            @semantic-release/npm@13.1.5
            @semantic-release/github@12.0.8
            @semantic-release/git@10.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
