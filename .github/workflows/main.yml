name: Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    if: "${{ !(contains(github.event.head_commit.message, '[skip ci]') && startsWith(github.event.head_commit.message, 'chore(contracts): release ')) }}"
    runs-on: ubuntu-24.04
    concurrency:
      group: verify-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true

      - name: Verify contracts
        run: mise run verify

      - name: Check generated artifacts are committed
        run: |
          test -z "$(git status --porcelain --untracked-files=all)" || {
            git status --porcelain --untracked-files=all
            exit 1
          }

  release:
    needs: [verify]
    if: ${{ github.ref == 'refs/heads/main' && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.repository }}-main
      cancel-in-progress: false
    environment:
      name: release
      deployment: false
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true

      - name: Release
        id: release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          semantic_version: 25.0.3
          extra_plugins: |
            @semantic-release/commit-analyzer@13.0.1
            @semantic-release/release-notes-generator@14.1.1
            @semantic-release/npm@13.1.5
            @semantic-release/github@12.0.8
            @jno21/semantic-release-github-commit@1.0.1
            conventional-changelog-conventionalcommits@9.3.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify immutable release
        if: steps.release.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.new_release_git_tag }}
        run: gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"

      - name: Verify published Go module
        if: steps.release.outputs.new_release_published == 'true'
        env:
          GO_MODULE: github.com/chill-institute/chill-contracts/v2
          RELEASE_TAG: ${{ steps.release.outputs.new_release_git_tag }}
        run: GOPROXY=direct go mod download "$GO_MODULE@$RELEASE_TAG"
