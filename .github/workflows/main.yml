name: Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    if: "${{ !(contains(github.event.head_commit.message, '[skip ci]') && startsWith(github.event.head_commit.message, 'chore(contracts): release ')) }}"
    runs-on: ubuntu-24.04
    concurrency:
      group: verify-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true

      - name: Verify contracts
        run: mise run verify

      - name: Check generated artifacts are committed
        run: |
          test -z "$(git status --porcelain --untracked-files=all)" || {
            git status --porcelain --untracked-files=all
            exit 1
          }

      - name: Check compatibility against the preceding release
        env:
          CONTRACTS_BASE_REF: release
        run: mise run compatibility:check

      - name: Scan pushed range
        if: ${{ !cancelled() }}
        uses: chill-institute/.github/.github/actions/scan@04bad7d160da50b0509abfd5ff2e382aaf7d1aef # v1.0.0

  release:
    needs: [verify]
    if: ${{ github.ref == 'refs/heads/main' && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-${{ github.repository }}-main
      cancel-in-progress: false
    environment:
      name: release
      deployment: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked semantic-release
        run: npm ci --prefix .github/release --ignore-scripts --no-audit --no-fund

      - name: Mint a chill-ci token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CHILL_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHILL_CI_APP_PRIVATE_KEY }}
          owner: chill-institute
          repositories: chill-contracts
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Release
        id: release
        run: node .github/release/release.mjs
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}

      - name: Verify immutable release
        if: steps.release.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_TAG: ${{ steps.release.outputs.new_release_git_tag }}
        run: gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"

      - name: Verify published Go module
        if: steps.release.outputs.new_release_published == 'true'
        env:
          GO_MODULE: github.com/chill-institute/chill-contracts/v2
          RELEASE_TAG: ${{ steps.release.outputs.new_release_git_tag }}
        run: GOPROXY=direct go mod download "$GO_MODULE@$RELEASE_TAG"
