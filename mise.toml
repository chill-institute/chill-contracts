[tools]
actionlint = "1.7.12"
buf = "1.75.0"
go = "1.27.3"
node = "24.22.1"
pnpm = "12.15.0"
zizmor = "1.31.1"

[env]
GOWORK = "off"

[tasks.generate]
description = "Generate Go, TypeScript, and OpenAPI artifacts from protobuf sources"
# Skips when these sources hash the same as the last local run; CI runs it fresh.
sources = ["proto/**/*.proto", "buf.yaml", "buf.lock", "buf.gen.yaml", "go.mod", "go.sum"]
outputs = ["gen/**/*"]
run = [
  "rm -rf gen",
  "buf generate",
  "go mod tidy"
]

[tasks."fmt:check"]
description = "Check protobuf source formatting without changing files"
run = "buf format --diff --exit-code"

[tasks.lint]
description = "Lint protobuf sources"
run = "buf lint"

[tasks."compatibility:check"]
description = "Check compatibility against CONTRACTS_BASE_REF or the preceding stable release"
run = 'go run ./tools/check-compatibility --against "${CONTRACTS_BASE_REF:-release}"'

[tasks."generated:check"]
description = "Fail when generated artifacts or other files differ from the commit"
run = "git status --porcelain --untracked-files=all | (! grep .)"

[tasks.test]
description = "Run Go tests against freshly generated artifacts"
depends = ["generate"]
run = "go test ./..."

[tasks.verify-consumers-go]
description = "Compile generated Go artifacts from a downstream module"
depends = ["generate"]
dir = "testdata/consumers/go"
run = "go test ./..."

[tasks.verify-consumers-ts]
description = "Import the published TypeScript surface from a downstream package"
depends = ["generate"]
dir = "testdata/consumers/ts"
run = [
  "node ./package-manager.mjs \"$(mise current pnpm)\"",
  "pnpm install --ignore-workspace --force --lockfile=false --lockfile-dir .",
  "node ./smoke.mjs"
]

[tasks.verify-consumers]
description = "Run downstream Go and TypeScript consumer checks"
depends = ["verify-consumers-go", "verify-consumers-ts"]

[tasks.actions]
description = "Validate and audit GitHub Actions"
run = ["actionlint", "zizmor .github/workflows"]

[tasks."release:smoke"]
description = "Check the shared release rules with a dry semantic-release run"
run = [
  "npm ci --prefix .github/release --ignore-scripts --no-audit --no-fund",
  "node .github/release/smoke.mjs"
]

[tasks.verify]
description = "Verify protobuf contracts and generated artifacts"
depends = ["fmt:check", "lint", "test", "verify-consumers", "actions"]

[tasks."hooks:pre-commit"]
description = "Hook entrypoint for fast protobuf checks on commit"
run = "buf lint"

[tasks."hooks:pre-push"]
description = "Hook entrypoint for read-only repo verification before push"
run = [
  "buf lint",
  "go test ./...",
]

[tasks.hooks]
description = "Install repo git hooks"
run = """
repo_root="$(git rev-parse --show-toplevel)"
cd "$repo_root"
git config core.hooksPath .githooks
printf 'git hooks configured: %s/.githooks\n' "$repo_root"
"""

[settings]
experimental = true
task.source_freshness_hash_contents = true

[hooks]
postinstall = "mise run hooks"
